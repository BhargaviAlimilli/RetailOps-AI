# Template only; backend application authentication remains required through the proxy.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: retailops-web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
    spec:
      containerConcurrency: 40
      timeoutSeconds: 150
      containers:
        - image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT/retailops/web:REPLACE_IMMUTABLE_TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          env:
            - name: API_UPSTREAM
              value: https://REPLACE_API_HOST.run.app
          startupProbe:
            httpGet:
              path: /
              port: 8080
