[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "retailops-api"
version = "0.1.0"
description = "RetailOps AI operations API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.14,<3", "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "structlog>=25,<27",
  "google-genai>=1.75,<2",
  "pgvector>=0.4,<0.5",
  "python-multipart>=0.0.22,<0.1",
  "httpx>=0.28,<1", "mcp>=1.26,<2", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "httpx2>=2.14,<3", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
