services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: retailops_demo
      POSTGRES_USER: retailops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailops_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - retailops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailops -d retailops_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  retailops_pgdata:
