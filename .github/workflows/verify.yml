name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: retailops_demo
          POSTGRES_USER: retailops
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailops -d retailops_demo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RETAILOPS_DATABASE_URL: postgresql+psycopg://retailops:ephemeral-ci-only@127.0.0.1:5432/retailops_demo
      RETAILOPS_AI_PROVIDER: disabled
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m pip_audit --local --skip-editable
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: retailops_demo
          POSTGRES_USER: retailops
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailops -d retailops_demo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RETAILOPS_DATABASE_URL: postgresql+psycopg://retailops:ephemeral-ci-only@127.0.0.1:5432/retailops_demo
      RETAILOPS_AI_PROVIDER: disabled
      RETAILOPS_ENVIRONMENT: development
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c backend/constraints.txt -e './backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Configure disposable demo credentials
        run: echo "RETAILOPS_DEMO_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m app.db.seed
        working-directory: backend
      - name: Start API and wait for readiness
        run: |
          python -m app > /tmp/retailops-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready; then exit 0; fi
            sleep 1
          done
          exit 1
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results/
          retention-days: 3
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify backend image builds
        run: docker build --tag retailops-api:check backend
      - name: Verify frontend image builds
        run: docker build --tag retailops-web:check frontend
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
